name: tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-matrix:
    name: test (py${{ matrix.python-version }}, ${{ matrix.resolution }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Newest releases on the oldest and newest supported Pythons, plus
        # every direct dependency at its declared floor.
        include:
          - python-version: "3.11"
            resolution: highest
          - python-version: "3.13"
            resolution: highest
          - python-version: "3.11"
            resolution: lowest-direct
    env:
      # Keeps each matrix job under its own GCS prefix; see worker_namespace
      # in conftest.py.
      COD_TEST_RUN_ID: ${{ github.run_id }}-${{ strategy.job-index }}
    steps:
    - uses: actions/checkout@v7

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python dependencies
      run: |
        pip install uv
        uv pip install --system --resolution ${{ matrix.resolution }} -e ".[test]"

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    # Tests hit real GCS buckets and occasionally get transient 429 rate-limit errors.
    # Retry up to 3 times with a 30s backoff, but only when the failure is a 429.
    - name: Run tests
      env:
        SISKIN_ENV_ENABLED: 1
      run: |
        set -o pipefail
        for attempt in 1 2 3; do
          python -m pytest -v -n auto cloud_optimized_dicom/tests 2>&1 | tee test_output.txt && exit 0
          if grep -q "429" test_output.txt; then
            echo "Attempt $attempt failed with 429 rate-limit error, retrying in 30s..."
            sleep 30
          else
            echo "Tests failed for non-rate-limit reasons."
            exit 1
          fi
        done
        echo "Tests failed after 3 attempts due to 429 errors."
        exit 1

    # Sweep this run's GCS prefixes regardless of test outcome so failed
    # runs don't leak orphan dirs forever.
    - name: Clean up test namespace
      if: always()
      run: |
        python - <<'PY'
        import os
        from google.cloud import storage
        from cloud_optimized_dicom.utils import delete_uploaded_blobs
        client = storage.Client(project="gradient-pacs-siskin-172863")
        rid = os.environ["COD_TEST_RUN_ID"]
        delete_uploaded_blobs(client, [
            f"gs://siskin-172863-temp/cod_tests/{rid}",
            f"gs://siskin-172863-temp/cod_thumbnail_tests/{rid}",
            f"gs://siskin-172863-temp/cod_error_log_tests/{rid}",
            f"gs://siskin-172863-test-data/{rid}",
        ])
        PY

  # The Main ruleset requires a check named "test", so this job reports the
  # matrix result under that name.
  test:
    needs: test-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
    - run: test "${{ needs.test-matrix.result }}" = success
