version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # pydicom is pinned at 2.3.0 to validate output from the pydicom3 fork;
      # bumping it would silently break that validation.
      - dependency-name: pydicom
    groups:
      python-dependencies:
        update-types:
          - minor
          - patch
