[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-optimized-dicom"
version = "1.2.0"
description = "A library for efficiently storing and interacting with DICOM files in the cloud"
readme = "README.md"
authors = [
    {name = "Cal Nightingale", email = "cal@gradienthealth.io"}
]
license = "MIT"
requires-python = ">=3.11,<3.14"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "smart-open==7.6.0",
    "ratarmountcore==0.10.4",
    "numpy",
    "google-cloud-storage==3.10.1",
    "filetype==1.2.0",
    "pylibjpeg==2.1.0",
    "pylibjpeg-libjpeg==2.4.0",
    "pylibjpeg-openjpeg==2.5.0",
    "pydicom3>=3.1.0",
    "opencv-python-headless==4.13.0.92",
    "ffmpeg-python==0.2.0",
    "zstandard>=0.24.0",
    # Floor ensures the urllib3 2.6+ Gzip/Brotli decoder fix from upstream PR #495 is installed.
    "google-resumable-media>=2.8.1",
]

[project.optional-dependencies]
beam = [
    "apache-beam[gcp]==2.73.0",
]
test = [
    "pydicom==2.3.0",
    "matplotlib",
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.6.0",
]
dev = [
    "pre-commit>=3.0.0",
    "pydicom==2.3.0",
    "matplotlib",
    "apache-beam[gcp]==2.73.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.6.0",
]

[tool.setuptools]
packages = {find = {}}
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["cloud_optimized_dicom/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
